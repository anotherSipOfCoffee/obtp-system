name: Validate and deploy System
on:
  push:
    branches: [main, dev/obtp-independent-v1-20260923]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: system-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/catalogue.cjs && node tests/cassette.cjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify WikiHouse and cassette before release
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/system-server.log 2>&1 &
          node tests/browser.cjs
          node tests/cassette-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-release-validation
          path: qa/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy System
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify published System
        env:
          OBTP_BASE_URL: https://anothersipofcoffee.github.io/obtp-system/
        run: |
          node tests/browser.cjs
          node tests/cassette-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-live-validation
          path: qa/
