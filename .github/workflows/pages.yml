name: Validate and deploy System
on:
  push:
    branches: [main, dev/obtp-independent-v1-20260923, dev/matrix-study-20260925]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: system-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/inspection.cjs && node tests/catalogue.cjs && node tests/cassette.cjs && node tests/matrix.cjs && node tests/connection-details.cjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify WikiHouse and cassette before release
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/system-server.log 2>&1 &
          node tests/browser.cjs
          node tests/cassette-browser.cjs
          node tests/connection-details-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-release-validation
          path: qa/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Wait for legacy branch Pages build
        uses: actions/github-script@v7
        with:
          script: |
            // Branch publishing is still enabled. Publish the prepared artifact last.
            for (let attempt = 0; attempt < 30; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const legacy = data.workflow_runs.filter(r =>
                r.name === 'pages build and deployment' && r.id !== context.runId);
              if (legacy.length && legacy.every(r => r.status === 'completed')) {
                core.info('Legacy branch publishing finished; releasing prepared files.');
                return;
              }
              if (!legacy.length && attempt >= 5) {
                core.info('No legacy branch build; continuing.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.setFailed('Legacy branch Pages build did not finish; refusing competing deployment.');
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy System
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify published System
        env:
          OBTP_BASE_URL: https://anothersipofcoffee.github.io/obtp-system/
        run: |
          node tests/browser.cjs
          node tests/cassette-browser.cjs
          node tests/connection-details-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-live-validation
          path: qa/
