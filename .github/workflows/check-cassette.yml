name: Check independent cassette (no deployment)
on:
  push:
    branches: ['dev/obtp-independent-v1-20260923', 'dev/cassette-connections-studio-controls-20260924']
    paths: ['dist/**', 'tests/**', 'tools/rhino8/**', '.github/workflows/check-cassette.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/connection-details.cjs
      - run: node tests/cassette.cjs
      - run: node tests/catalogue.cjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/obtp-server.log 2>&1 &
          node tests/cassette-browser.cjs
          node tests/connection-details-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cassette-validation
          path: |
            qa/
            cassette-validation.json
          retention-days: 30
