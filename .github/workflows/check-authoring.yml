name: Check canonical GH authoring
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rhino3dm==8.35.0 reportlab numpy pillow ezdxf==1.4.4
      - run: python -m unittest discover -s authoring/grasshopper/tests
      - run: python authoring/grasshopper/EXPORT_SYSTEM_COMPARISON.py
      - run: python authoring/grasshopper/EXPORT_STUDIO_M_PDFS.py
      - run: python authoring/grasshopper/EXPORT_LAYOUT_REVIEW.py
      - run: python authoring/grasshopper/EXPORT_SAUNA_WORKFLOW.py
      - run: python tools/package-gh.py /tmp/OBTP_Grasshopper_R24.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OBTP-Grasshopper-R24
          path: /tmp/OBTP_Grasshopper_R24.zip
          retention-days: 30
