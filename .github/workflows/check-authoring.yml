name: Check canonical GH authoring
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rhino3dm==8.35.0 reportlab
      - run: python -m unittest discover -s authoring/grasshopper/tests
      - run: python authoring/grasshopper/export_web.py /tmp/sauna-catalogue --revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: grasshopper-and-default-studio-documents
          path: |
            /tmp/sauna-catalogue/OBTP_Grasshopper_Source.zip
            /tmp/sauna-catalogue/studio-m-open-r0-t2-w1180-f0-b0-summer-*.pdf
          retention-days: 30
